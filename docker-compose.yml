services:
  keepwatch:
    image: ghcr.io/tfourj/keepwatch:latest
    container_name: keepwatch
    restart: unless-stopped
    ports:
      - "${PORT:-4321}:${PORT:-4321}"
    environment:
      PORT: ${PORT:-4321}
      BASE_URL: ${BASE_URL:-http://localhost:4321}
      # Leave empty to auto-generate into /data/secrets.json on first run
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-}
      TZ: ${TZ:-UTC}
    volumes:
      - keepwatch-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  keepwatch-data:
